name: threads-bot

# 세 가지 방식으로 깨어난다.
#
#   repository_dispatch — 답글이 달리는 즉시 (웹훅 릴레이가 호출). 주 경로.
#   schedule           — 15분마다. 예약 게시물 발행 + 웹훅이 유실됐을 때의 안전망.
#   workflow_dispatch  — 수동 실행 / dry-run
#
# 웹훅만 믿으면 안 된다. Meta가 재시도에 실패하면 이벤트가 그냥 사라진다.
# 크론이 그걸 주워담는다.
on:
  repository_dispatch:
    types: [threads-reply]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발행하지 않고 초안만 출력"
        type: boolean
        default: false

concurrency:
  # 앞 실행이 끝나기 전에 다음 실행이 겹치면 같은 답글에 두 번 답할 수 있다.
  group: threads-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet anthropic

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        # 웹훅으로 깨어난 실행은 답글만 처리한다. 예약 게시는 크론 몫이다.
        run: |
          python3 bot/agent.py \
            ${{ github.event_name == 'repository_dispatch' && '--replies-only' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit state
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- bot/state.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add bot/state.json
          git commit -m "chore(bot): 상태 갱신"
          # 다른 실행이 먼저 커밋했을 수 있다. rebase 후 재시도.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
